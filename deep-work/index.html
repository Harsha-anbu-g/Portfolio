<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Work</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201C15" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-tab="list">
    <p class="boot" id="boot" role="status">Opening Deep Work…</p>
    <noscript><p class="boot">Deep Work needs JavaScript turned on.</p></noscript>

    <!-- Sign in -->
    <section class="signin" id="signin" aria-labelledby="signin-h" hidden>
      <form class="signin-form" id="signin-form" novalidate>
        <div class="signin-head">
          <h1 id="signin-h">Deep Work</h1>
          <p>One thing at a time.</p>
        </div>
        <p class="signin-error" id="signin-error" role="alert" hidden></p>
        <label class="signin-field" for="signin-user">
          User ID
          <input type="text" id="signin-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required />
        </label>
        <label class="signin-field" for="signin-password">
          Password
          <input type="password" id="signin-password" name="password" autocomplete="current-password" maxlength="200" required />
        </label>
        <button type="submit" class="btn primary big" id="signin-submit">Sign in</button>
      </form>
    </section>

    <!-- The plan: everything to do, and the hours of the day -->
    <div class="app" id="app" hidden>
      <header class="top wrap">
        <div class="brand">
          <h1>Deep Work</h1>
          <p class="today" id="today-label"></p>
        </div>
        <section class="nowbar" aria-label="Right now">
          <div class="now-clock">
            <span class="now-tag">Now</span>
            <span class="now-hour" id="now-hour"></span>
            <span class="now-left" id="now-left"></span>
          </div>
          <div class="now-items" id="now-items"></div>
          <button type="button" class="btn small primary now-focus" id="focus-open">Focus</button>
        </section>
        <div class="account">
          <p class="sync" id="sync" role="status" data-state="busy">Loading</p>
          <button type="button" class="btn small ghost" id="signout">Sign out</button>
        </div>
      </header>

      <p class="notice wrap" id="notice" hidden></p>

      <nav class="tabs" aria-label="Choose a column">
        <button type="button" id="tab-list" aria-pressed="true">Everything</button>
        <button type="button" id="tab-hours" aria-pressed="false">Hours</button>
      </nav>

      <main class="wrap" id="main">
        <section class="col col-list" aria-labelledby="list-h">
          <div class="col-head">
            <h2 id="list-h">Everything to do</h2>
            <span class="count" id="open-count"></span>
          </div>
          <form class="add" id="add-form" autocomplete="off">
            <label class="sr" for="new-title">New task</label>
            <input type="text" id="new-title" maxlength="200" placeholder="Add something you need to do" />
            <div class="add-row">
              <label class="field" for="new-deadline">Deadline <input type="date" id="new-deadline" /></label>
              <label class="check" for="new-daily"><input type="checkbox" id="new-daily" /> Every day</label>
              <button type="submit" class="btn primary push" id="new-add">Add</button>
            </div>
          </form>
          <div class="col-body" id="list-body">
            <p class="state" id="list-state">Loading your list…</p>
            <section id="sec-daily" hidden>
              <h3 class="section-label">Every day</h3>
              <ul class="tasks" id="ul-daily"></ul>
            </section>
            <section id="sec-dated" hidden>
              <h3 class="section-label">With a deadline</h3>
              <ul class="tasks" id="ul-dated"></ul>
            </section>
            <section id="sec-undated" hidden>
              <h3 class="section-label">No deadline yet</h3>
              <ul class="tasks" id="ul-undated"></ul>
            </section>
            <details class="done-box" id="sec-done" hidden>
              <summary id="done-summary">Done</summary>
              <ul class="tasks" id="ul-done"></ul>
            </details>
          </div>
        </section>

        <section class="col col-hours" aria-labelledby="hours-h">
          <div class="col-head">
            <h2 id="hours-h">Hours</h2>
            <div class="seg" role="group" aria-label="Day">
              <button type="button" id="view-today" aria-pressed="true">Today <small id="view-today-date"></small></button>
              <button type="button" id="view-tomorrow" aria-pressed="false">Tomorrow <small id="view-tomorrow-date"></small></button>
            </div>
          </div>
          <div class="arm" id="arm" hidden>
            <span><span id="arm-lead"></span> <b id="arm-title"></b></span>
            <button type="button" class="btn small" id="arm-cancel">Cancel</button>
          </div>
          <div class="col-body" id="hours-body">
            <ol class="hours" id="hours"></ol>
          </div>
        </section>
      </main>
    </div>

    <!-- Focus: only this hour's task -->
    <section class="focus" id="focus" aria-label="Focus" hidden>
      <header class="focus-top">
        <p class="focus-brand">Deep Work</p>
        <button type="button" class="btn small" id="focus-exit">Show the plan</button>
      </header>
      <div class="focus-main">
        <p class="focus-when">
          <span class="now-tag">Now</span>
          <span class="focus-hour" id="focus-hour"></span>
          <span id="focus-left"></span>
        </p>
        <div aria-live="polite">
          <h2 class="focus-title" id="focus-title" tabindex="-1"></h2>
          <p class="focus-note" id="focus-note" hidden></p>
        </div>
        <div class="focus-actions">
          <button type="button" class="btn primary big" id="focus-done">Done</button>
          <button type="button" class="btn primary big" id="focus-plan" hidden>Plan this hour</button>
          <button type="button" class="btn big" id="focus-undo" hidden>Undo</button>
        </div>
        <progress class="focus-progress" id="focus-progress" max="60" value="0" aria-label="How much of this hour has passed"></progress>
        <p class="focus-next" id="focus-next" hidden></p>
      </div>
    </section>

    <dialog class="picker" id="picker" aria-labelledby="pick-h">
      <div class="pick-head">
        <h3 id="pick-h"></h3>
        <button type="button" class="btn small ghost" id="pick-close">Close</button>
      </div>
      <ul class="pick-list" id="pick-list"></ul>
      <form class="pick-new" id="pick-form" autocomplete="off">
        <label class="sr" for="pick-title">New task for this hour</label>
        <input type="text" id="pick-title" maxlength="200" placeholder="Or type a new task" />
        <button type="submit" class="btn primary" id="pick-add">Add</button>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/src/deepwork/main.js"></script>
  </body>
</html>
